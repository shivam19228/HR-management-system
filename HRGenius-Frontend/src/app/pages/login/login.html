<div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-teal-950 flex items-center justify-center p-4 sm:p-6 lg:p-8">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">

    <!-- Top Hero Banner -->
    <div class="bg-gradient-to-r from-emerald-600 to-teal-600 px-8 py-8 text-white text-center relative overflow-hidden">
      <div class="absolute -right-10 -bottom-10 w-36 h-36 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
      <div class="inline-flex items-center justify-center w-14 h-14 bg-white/20 backdrop-blur-md rounded-2xl shadow-inner mb-3 border border-white/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
      </div>

      <h1 class="text-2xl font-black tracking-tight">HRGenius</h1>
      <p class="text-emerald-100 text-xs mt-1 font-medium">Enterprise HR Management System</p>
    </div>

    <!-- Login Form Area -->
    <div class="p-8">

      <div class="mb-6">
        <h2 class="text-xl font-bold text-slate-800">Welcome Back</h2>
        <p class="text-sm text-slate-500 mt-1">Sign in with your credentials to access the HR portal.</p>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="mb-5 p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm flex items-center gap-2">
        <svg class="w-5 h-5 shrink-0 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4">

        <!-- Username / Email -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
            Username or Work Email
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </span>
            <input
              type="text"
              name="username"
              [(ngModel)]="username"
              required
              placeholder="e.g. admin or sarah.j@hrgenius.com"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all" />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5">
            Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input
              type="password"
              name="password"
              [(ngModel)]="password"
              required
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all" />
          </div>
        </div>

        <!-- Remember & Forgot -->
        <div class="flex items-center justify-between text-xs pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-slate-600">
            <input
              type="checkbox"
              name="rememberMe"
              [(ngModel)]="rememberMe"
              class="rounded text-emerald-600 focus:ring-emerald-500 border-slate-300" />
            <span>Remember this device</span>
          </label>
          <span class="text-emerald-700 font-semibold cursor-pointer hover:underline">Forgot password?</span>
        </div>

        <!-- Submit Button -->
        <button
          id="btn-login"
          type="submit"
          [disabled]="isLoading"
          class="w-full mt-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-emerald-700/20 transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-75">
          <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>{{ isLoading ? 'Authenticating...' : 'Sign In to Dashboard' }}</span>
        </button>

      </form>

      <!-- Quick Fill Test Accounts for Demo -->
      <div class="mt-6 pt-5 border-t border-slate-100">
        <p class="text-xs text-center text-slate-400 font-medium mb-2.5">Demo Quick Logins (Click to autofill):</p>
        <div class="grid grid-cols-3 gap-2">
          <button
            id="quick-admin"
            type="button"
            (click)="quickFill('admin')"
            class="text-[11px] font-semibold py-1.5 px-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300 border border-slate-200 rounded-lg text-slate-700 transition-colors">
            HR Admin
          </button>
          <button
            id="quick-manager"
            type="button"
            (click)="quickFill('manager')"
            class="text-[11px] font-semibold py-1.5 px-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300 border border-slate-200 rounded-lg text-slate-700 transition-colors">
            HR Lead
          </button>
          <button
            id="quick-employee"
            type="button"
            (click)="quickFill('employee')"
            class="text-[11px] font-semibold py-1.5 px-2 bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300 border border-slate-200 rounded-lg text-slate-700 transition-colors">
            Employee
          </button>
        </div>
      </div>

      <!-- Register Link -->
      <div class="mt-6 text-center text-xs text-slate-500">
        Don't have an account yet?
        <a routerLink="/register" class="font-semibold text-emerald-700 hover:text-emerald-800 ml-1 hover:underline">
          Create Account
        </a>
      </div>

    </div>

  </div>

</div>
